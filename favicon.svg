<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond arrondi -->
  <rect x="10" y="10" width="80" height="80" rx="15" fill="url(#bgGradient)"/>
  
  <!-- Livre/Manga simplifié -->
  <rect x="25" y="30" width="25" height="40" rx="2" fill="#1c2128" opacity="0.8"/>
  <rect x="50" y="30" width="25" height="40" rx="2" fill="#1c2128" opacity="0.6"/>
  
  <!-- Ligne de séparation -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="#ff8c00" stroke-width="2"/>
</svg>