<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Manga/Anime</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Liste Manga/Anime</h1>
            <button class="refresh-all-btn" onclick="refreshAllWrapper()" title="Mettre à jour toutes les infos">
                🔄 Tout mettre à jour
            </button>
        </header>

        <div class="add-form">
            <div class="input-group" style="flex: 2;">
                <label>Titre</label>
                <input type="text" id="inputTitle" placeholder="Nom de l'Anime/Manga">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Type</label>
                <select id="inputType">
                    <option value="Anime">📺 Anime</option>
                    <option value="Manga">📖 Manga</option>
                </select>
            </div>
            <button class="add-btn" onclick="addItemWrapper()">+ Ajouter</button>
        </div>

        <div class="main-layout">
            <div class="view-toggle">
                <button class="toggle-btn active" id="btnManga" onclick="showSection('manga')">
                    <span class="icon">📖</span> Mangas
                </button>
                <button class="toggle-btn" id="btnAnime" onclick="showSection('anime')">
                    <span class="icon">📺</span> Animes
                </button>
                <button class="toggle-btn" id="btnFav" onclick="showSection('fav')">
                    <span class="icon">⭐</span> Favoris
                </button>
                <button class="toggle-btn" id="btnSites" onclick="showSection('sites')">
                    <span class="icon">🌐</span> Sites
                </button>
            </div>
            <div class="three-column-layout" id="sectionsLayout" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; align-items: start;">
                <div class="content-section" id="sectionManga">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">📖</span> Mangas
                        </div>
                    </div>
                    <div class="grid-container" id="mangaListContainer"></div>
                </div>
                <div class="content-section" id="sectionAnime" style="display:none;">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">📺</span> Animes
                        </div>
                    </div>
                    <div class="grid-container" id="animeListContainer"></div>
                </div>
                <div class="content-section" id="sectionFav" style="display:none;">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">⭐</span> Favoris <span id="favCount">(0)</span>
                        </div>
                    </div>
                    <div class="grid-container" id="favListContainer"></div>
                </div>
                <div class="content-section" id="sectionSites" style="display:none;">
                    <div class="section-header">
                        <div class="section-title">
                            <span class="icon">🌐</span> Sites
                        </div>
                    </div>
                    <div class="grid-container" id="sitesListContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal d'édition -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>✏️ Modifier</h3>
            <div class="modal-input-group">
                <label>Titre</label>
                <input type="text" id="editTitle" placeholder="Nom de l'Anime/Manga">
            </div>
            <div class="modal-input-group">
                <label>Type</label>
                <select id="editType">
                    <option value="Anime">📺 Anime</option>
                    <option value="Manga">📖 Manga</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeEditModal()">Annuler</button>
                <button class="modal-btn modal-btn-save" onclick="saveEditWrapper()">Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Panneau latéral détails -->
    <div class="detail-panel" id="detailPanel">
        <div class="detail-panel-header">
            <h2 id="detailTitle">Titre</h2>
            <button class="detail-close-btn" onclick="closeDetailPanel()">✕</button>
        </div>
        <div class="detail-panel-content">
            <div class="detail-image-container">
                <img id="detailImage" src="" alt="Cover">
            </div>
            <div class="detail-info">
                <div class="detail-badges">
                    <span class="detail-badge type" id="detailType">Manga</span>
                    <span class="detail-badge status" id="detailStatus">En cours</span>
                </div>
                <div class="detail-progress-section">
                    <h3>Progression</h3>
                    <div class="detail-progress-bar">
                        <div class="detail-progress-fill" id="detailProgressFill"></div>
                    </div>
                    <div class="detail-progress-text">
                        <span id="detailProgressCurrent">0</span> / <span id="detailProgressTotal">?</span>
                        <span id="detailProgressType">chapitres</span>
                    </div>
                    <div class="detail-progress-percent" id="detailProgressPercent">0%</div>
                </div>
                <div class="detail-actions">
                    <button class="detail-action-btn" onclick="detailUpdateProgress(-1)">
                        <span>−</span>
                    </button>
                    <input type="number" id="detailProgressInput" class="detail-progress-input" onchange="detailSetProgress(this.value)">
                    <button class="detail-action-btn" onclick="detailUpdateProgress(1)">
                        <span>+</span>
                    </button>
                </div>
                <div class="detail-note-section">
                    <h3>📝 Note personnelle</h3>
                    <textarea id="detailNote" class="detail-note-input" placeholder="Ajouter une note..." onchange="detailSaveNote(this.value)"></textarea>
                </div>
                <div class="detail-buttons">
                    <button class="detail-btn fav" id="detailFavBtn" onclick="detailToggleFav()">
                        <span>⭐</span> Favori
                    </button>
                    <button class="detail-btn edit" onclick="detailEdit()">
                        <span>✏️</span> Modifier
                    </button>
                    <button class="detail-btn delete" onclick="detailDelete()">
                        <span>🗑️</span> Supprimer
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="detail-overlay" id="detailOverlay" onclick="closeDetailPanel()"></div>

    <script src="script.js?v=20251211"></script>
</body>
</html>
